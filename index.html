<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | xAk19x</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AOS (Animate on Scroll) Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        /* Custom smooth dark gradient animation */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #050505, #120305, #1c0509, #050505);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
    </style>
</head>
<body class="animated-bg text-white min-h-screen flex flex-col justify-between font-sans selection:bg-red-600 selection:text-white">

    <!-- Header / Navbar -->
    <header class="w-full p-6 flex justify-between items-center max-w-6xl mx-auto" data-aos="fade-down" data-aos-duration="1000">
        <h1 class="text-2xl font-extrabold tracking-wider bg-gradient-to-r from-red-500 to-white bg-clip-text text-transparent">
            xAk19x.dev
        </h1>
        <nav class="space-x-6 text-gray-400">
            <a href="#about" class="hover:text-red-500 transition">About</a>
            <a href="#contact" class="hover:text-red-500 transition">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <main class="max-w-4xl mx-auto px-6 text-center my-auto py-20">
        <div data-aos="zoom-in" data-aos-duration="1200">
            <span class="px-4 py-1.5 rounded-full text-sm font-medium bg-red-950/40 border border-red-800/50 text-red-400 inline-block mb-6">
                🚀 Welcome to my digital space
            </span>
            <h2 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 leading-tight">
                Roblox Game <br>
                <span class="bg-gradient-to-r from-red-500 via-red-400 to-white bg-clip-text text-transparent">
                    Developer.
                </span>
            </h2>
            <p class="text-gray-300 text-lg md:text-xl max-w-2xl mx-auto mb-10 leading-relaxed">
                Roblox Game Developer & B.Tech CSE Student. Passionate about programming, creating immersive experiences, and constantly exploring new tech.
            </p>
            <div class="flex justify-center gap-4">
                <a href="https://ak19.carrd.co/" target="_blank" class="px-8 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-semibold shadow-lg shadow-red-900/40 transition transform hover:-translate-y-1">
                    My Carrd
                </a>
                <a href="https://github.com/xAk19x" target="_blank" class="px-8 py-3 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-white font-semibold transition transform hover:-translate-y-1">
                    GitHub Profile
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-6 text-gray-500 text-sm border-t border-zinc-900" data-aos="fade" data-aos-duration="1000">
        <p>&copy; 2026 xAk19x. Powered by GitHub Pages.</p>
    </footer>

    <!-- AOS Script initialization -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            once: true,
        });
    </script>
</body>
</html>
